# Docs for the Azure Web Apps Deploy action: https://github.com
# More GitHub Actions for Azure: https://github.com

name: Build and deploy ASP.Net Core app to Azure Web App - nhpblazorapp

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        working-directory: ./CustomAuthenticationApp
        run: dotnet build CustomAuthenticationApp.API.csproj --configuration Release

      - name: dotnet publish
        working-directory: ./CustomAuthenticationApp
        run: dotnet publish CustomAuthenticationApp.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nhpblazorapp'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5F495672AFAA4A7C83E99F5DD347FA0C }}
