# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Blazor-API-App

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # UPDATE 1: Add the explicit path to your Web API project file here
      - name: Build with dotnet
        run: dotnet build ./CustomAuthenticationApp/CustomAuthenticationApp.csproj --configuration Release

      # UPDATE 2: Add the explicit path to your Web API project file here as well
      - name: dotnet publish
        run: dotnet publish ./CustomAuthenticationApp/CustomAuthenticationApp.csproj.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp-extracted # Safely extract the compiled code into a designated directory

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Blazor-API-App'
          slot-name: 'Production'
          package: ./myapp-extracted # UPDATE 3: Deploy the actual compiled artifact rather than the root directory
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D5A6062E39A1439C84F5F36A7A08AD7A }}
