name: Build and deploy Blazor WASM to Azure App Service

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # 1. Step into the folder containing the UI project and publish it
      - name: dotnet publish
        working-directory: ./DynamicAuthBlazor.Web
        run: dotnet publish DynamicAuthBlazor.Web.csproj -c Release -o ./publish-output

      # 2. Upload only the compiled static assets (index.html, framework files, etc.)
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: blazor-ui-app
          path: ./DynamicAuthBlazor.Web/publish-output/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: blazor-ui-app
          path: .  # Unpacks directly into the deployment root context
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          # Make sure this matches the exact name of the App Service created for your UI
          app-name: 'BLAZORUIAPPLICATION'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B54D399BE1BE4FC3B4FAF163324FF3AD }}
