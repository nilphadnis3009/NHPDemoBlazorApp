name: Build and deploy Blazor WASM to Azure Static Web App

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build and Publish Client
        working-directory: ./DynamicAuthBlazor.Web
        run: dotnet publish DynamicAuthBlazor.Web.csproj -c Release -o output

      - name: Deploy to Azure Static Web App
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # FIXED: Targeted the exact auto-provisioned secret name generated by Azure
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/DynamicAuthBlazor.Web" 
          api_location: ""
          output_location: "output/wwwroot" 
