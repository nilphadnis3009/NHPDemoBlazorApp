name: Build and deploy Blazor WASM to Azure Static Web App

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build and Publish Client
        # Directs the terminal inside your UI project directory to build static web assets
        working-directory: ./CustomAuthenticationApp
        run: dotnet publish CustomAuthenticationApp.Client.csproj -c Release -o output

      - name: Deploy to Azure Static Web App
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Make sure you create this secret token in your GitHub repo settings if it's missing!
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          
          # Sets the directory context where the build was run
          app_location: "/CustomAuthenticationApp" 
          api_location: ""
          
          # Points explicitly to the folder containing the published HTML/WASM distribution assets
          output_location: "output/wwwroot" 
